name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            components -> components/target

      - name: Install wkg and wasm-tools
        uses: cargo-bins/cargo-binstall@main

      - run: cargo binstall -y --force wkg wasm-tools

      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --all --check --manifest-path components/Cargo.toml

      - name: Validate WIT package
        run: |
          wasm-tools component wit wit/ > /dev/null
          wkg wit build --wit-dir wit -o dapr-wasm-components-interface.wasm

      - name: Build components
        run: cargo build --release --target wasm32-wasip2 --manifest-path components/Cargo.toml

      - name: Validate components
        run: |
          wasm-tools validate components/target/wasm32-wasip2/release/dapr_wasm_components_wasi_http.wasm
          wasm-tools validate components/target/wasm32-wasip2/release/kv-demo.wasm

      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --target wasm32-wasip2 --manifest-path components/Cargo.toml -- -D warnings

      - name: Test (provider + composed app against a mock sidecar)
        run: cargo test

  dapr-e2e:
    # Real end-to-end: two wasm microservices, each behind an actual daprd
    # sidecar, with Redis pub/sub between them (started by the test itself
    # via testcontainers).
    runs-on: ubuntu-latest
    env:
      DAPR_VERSION: "1.18.0"
      WASMTIME_VERSION: "45.0.1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            components -> components/target

      - name: Install wasmtime CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" \
            | tar xJ -C /tmp
          mv "/tmp/wasmtime-v${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install daprd
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL "https://github.com/dapr/dapr/releases/download/v${DAPR_VERSION}/daprd_linux_amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" daprd
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build components
        run: cargo build --release --target wasm32-wasip2 --manifest-path components/Cargo.toml

      - name: Run real-Dapr E2E (wasm microservices through daprd sidecars)
        run: cargo test --test dapr -- --ignored --nocapture

  publish:
    # Push both modules to this repository's OCI registry (ghcr.io) with wkg:
    # tag `latest` on pushes to main, the release version on GitHub releases.
    needs: [test, dapr-e2e]
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            components -> components/target

      - name: Install wkg
        uses: cargo-bins/cargo-binstall@main

      - run: cargo binstall -y --force wkg

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine OCI tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            WIT_VERSION=$(grep -oP 'package dapr-wasm-components:interfaces@\K[0-9a-zA-Z.+-]+' wit/types.wit)
            if [ "$TAG" != "$WIT_VERSION" ]; then
              echo "Release tag $TAG does not match WIT package version $WIT_VERSION" >&2
              exit 1
            fi
          else
            TAG=latest
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build modules
        run: |
          wkg wit build --wit-dir wit -o dapr-wasm-components-interface.wasm
          cargo build --release --target wasm32-wasip2 --manifest-path components/Cargo.toml -p dapr-wasm-components-wasi-http

      - name: Publish interface module
        run: |
          wkg oci push "ghcr.io/${{ github.repository_owner }}/dapr-wasm-components-interface:${{ steps.tag.outputs.tag }}" \
            dapr-wasm-components-interface.wasm \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.description=WIT interfaces for Dapr building blocks (dapr-wasm-components:interfaces)" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0"

      - name: Publish wasi-http implementation module
        run: |
          wkg oci push "ghcr.io/${{ github.repository_owner }}/dapr-wasm-components-wasi-http:${{ steps.tag.outputs.tag }}" \
            components/target/wasm32-wasip2/release/dapr_wasm_components_wasi_http.wasm \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.description=Pure-wasm Dapr provider implementing dapr-wasm-components:interfaces over wasi:http" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0"

name: Publish WIT package

# Publishes the `dapr-wasm-components:interfaces` WIT package with `wkg publish`
# under the name wkg's own resolver expects
# (ghcr.io/sideeffffect/dapr-wasm-components/interfaces:<version>, see
# wkg-config.toml), so consumers can depend on it with `wkg wit fetch`.
#
# Called by ci.yml on GitHub releases (after all tests pass). It can also be
# run by hand for an existing release tag to backfill a version.
on:
  workflow_call:
    inputs:
      ref:
        description: Release tag to publish (e.g. v0.7.2)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to publish (e.g. v0.7.2)
        required: true
        type: string

env:
  WKG_VERSION: "0.16.1"

jobs:
  publish-wit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Config from the default branch, not from the tag: older tags predate
      # wkg-config.toml.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .main
          sparse-checkout: wkg-config.toml
          sparse-checkout-cone-mode: false

      - name: Cache wkg
        id: cache-wkg
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wkg
          key: bintools-${{ runner.os }}-wkg-${{ env.WKG_VERSION }}

      - name: Install cargo-binstall
        if: steps.cache-wkg.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@main

      - name: Install wkg
        if: steps.cache-wkg.outputs.cache-hit != 'true'
        run: cargo binstall -y --force "wkg@${WKG_VERSION}"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check tag matches WIT package version
        run: |
          TAG="${{ inputs.ref }}"
          TAG="${TAG#v}"
          WIT_VERSION=$(grep -oP 'package dapr-wasm-components:interfaces@\K[0-9a-zA-Z.+-]+' components/wit/types.wit)
          if [ "$TAG" != "$WIT_VERSION" ]; then
            echo "Tag $TAG does not match WIT package version $WIT_VERSION" >&2
            exit 1
          fi

      - name: Build and publish
        env:
          WKG_CONFIG_FILE: .main/wkg-config.toml
        run: |
          wkg build --wit-dir components/wit -o interfaces.wasm
          # --skip-dupes makes a re-run (or a backfill of an already published
          # version) a no-op instead of a failure.
          wkg publish --skip-dupes interfaces.wasm

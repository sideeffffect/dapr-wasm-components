[package]
name = "dapr-wasm-components-wasi-grpc-outbound"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pure-wasm Dapr provider (outbound): exports the dapr-wasm-components building blocks and talks to the Dapr sidecar's gRPC API via wasi:http outgoing HTTP/2 (requires a Spin >= 3.4 host with SPIN_OUTBOUND_H2C_PRIOR_KNOWLEDGE)"
repository = "https://github.com/sideeffffect/dapr-wasm-components"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
futures = "0.3"
http = "1"
humantime = "2"
prost = "0.13"
prost-types = "0.13"
serde_json = "1"
spin-executor = "4"
tonic = { version = "0.13.1", default-features = false, features = ["codegen", "prost"] }
wasi-grpc = "0.1.0"
wit-bindgen = "0.58"

[package]
name = "spin-demo"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "E2E microservice for the wasi-grpc provider: serves its Dapr app channel under Spin and exercises state, pub/sub and invocation over the sidecar's gRPC API"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dapr-app = { path = "../../../app-sdk/dapr-app" }
serde_json = "1"

[package]
name = "microservice"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "E2E microservice (typed Dapr reactor): one app run as two instances to exercise state, pub/sub and service invocation against a Dapr sidecar — composed with either provider, served by wasmtime or Spin"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dapr-app = { path = "../../../app-sdk/dapr-app" }
serde_json = "1"
